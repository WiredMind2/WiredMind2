<svg width="440" height="180" viewBox="0 0 440 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repoTitle03 repoDesc03">
  <title id="repoTitle03">AnimeManager</title>
  <desc id="repoDesc03">AnimeManager is a Python streaming application that also handles anime discovery from multiple sources, torrent searching, automatic downloads via various torrent client integrations, and provides built-in media playback.</desc>
  <style>

    :root {
        --night: #08090b;
        --surface: #0e1014;
        --raised: #14171c;
        --ink: #e8e6e1;
        --muted: #8b919c;
        --line: #20242b;
        --acid: #c8f750;
        --acid-dim: #8fb52e;
    }

    .font-display {
        font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        fill: var(--ink);
    }
    .font-mono {
        font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
    }
    .font-body {
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0;
        text-transform: none;
        fill: var(--ink);
    }
    .bg { fill: var(--night); }
    .surface { fill: var(--surface); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .acid { fill: var(--acid); }
    .line { stroke: var(--line); }

    @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes sweep {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
    }
    @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(8px, -6px); }
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
    }
    @keyframes cellIn {
        from { opacity: 0; transform: scale(0.65); }
        to { opacity: 1; transform: scale(1); }
    }

    .rise { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .fade { animation: fade 0.8s ease both; }
    .bar-grow {
        transform-box: fill-box;
        transform-origin: left center;
        animation: sweep 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .underline-grow {
        transform-box: fill-box;
        transform-origin: left center;
        animation: sweep 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .drift { animation: drift 8s ease-in-out infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .cell-in {
        transform-box: fill-box;
        transform-origin: center;
        animation: cellIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.12s; }
    .d3 { animation-delay: 0.2s; }
    .d4 { animation-delay: 0.28s; }
    .d5 { animation-delay: 0.36s; }
    .d6 { animation-delay: 0.44s; }
    .d7 { animation-delay: 0.52s; }
    .d8 { animation-delay: 0.6s; }

    @media (prefers-reduced-motion: reduce) {
        .rise, .fade, .bar-grow, .underline-grow, .drift, .pulse, .cell-in {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
    }

    .ghost {
      font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
      font-weight: 800;
      font-size: 72px;
      letter-spacing: -0.04em;
      fill: none;
      stroke: var(--line);
      stroke-width: 1.25;
    }
  </style>

  <rect width="440" height="180" class="surface"/>
  <rect x="0.5" y="0.5" width="439" height="179" fill="none" stroke="var(--line)"/>

  <text x="422" y="78" text-anchor="end" class="ghost fade d1">03</text>

  <g class="rise d2">
    <rect x="21.5" y="25.5" width="5" height="5" fill="var(--acid)" transform="rotate(45 24 28)"/>
    <text x="36" y="32" class="font-mono" style="font-size:10px; fill: var(--acid)">03 / FEATURED</text>
    <circle cx="20" cy="58" r="4" fill="#3572A5"/>
    <text x="32" y="63" class="font-display" style="font-size:22px">ANIMEMANAGER</text>
    <text x="20" y="82" class="font-body" style="font-size:12px; fill: var(--muted)">AnimeManager is a Python streaming</text><text x="20" y="99" class="font-body" style="font-size:12px; fill: var(--muted)">application that also handles anime</text>
  </g>

  <g class="rise d4">
    
      <g transform="translate(20, 118)">
        <rect width="58.8" height="22" fill="none" stroke="var(--acid)" stroke-opacity="0.45"/>
        <text x="29.4" y="15" text-anchor="middle" class="font-mono" style="font-size:10px; letter-spacing:0.12em; fill: var(--acid)">PYTHON</text>
      </g>
    <text x="420" y="160" text-anchor="end" class="font-mono" style="font-size:14px; letter-spacing:0; fill: var(--acid)">↗</text>
    <rect x="20" y="178" width="400" height="1" fill="var(--acid)" class="underline-grow" style="animation-delay:0.25s"/>
  </g>
</svg>
