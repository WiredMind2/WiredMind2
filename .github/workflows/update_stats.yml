name: Update GitHub Stats

on:
  schedule:
    # Run every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate profile SVGs
        env:
          # Classic PAT (public_repo + read:user). The default GITHUB_TOKEN is a
          # GitHub Actions installation token, which GitHub forbids from reading
          # the GraphQL stargazers/languages fields, so it must not be used here.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          PROFILE_DISPLAY_NAME: William Michaud
        run: python generate_stats.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A profile_header.svg about.svg github_stats.svg featured_heading.svg footer_github.svg footer_portfolio.svg cards README.md
          git commit -m "Update GitHub profile stats" || exit 0
          git push
